name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
 lint:
  test:
    runs-on: ubuntu-latest

    steps:
     - name: Check out the code
       uses:  actions/checkout@v5
       
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install flake8
        run: pyhon -m pip install flake8

      - name: Run flake8
        run: flake8 pricing.py test/
test:
 run-on: ubuntu-latest

  steps:
      - uses: actions/checkout@v5
     
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

     - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

